<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Cadastro - Vira Página</title>
</head>
<body class="pagina-cadastro">
  <header>
    <div class="titulo">
      <h1>Vira Página</h1>
    </div>
  </header>

  <main class="formulario-cadastro">
    <h2>Cadastro</h2>

    <form action="#" method="get">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

      <label for="nascimento">Data de nascimento</label>
      <input type="date" id="nascimento" name="nascimento" required>

      <label for="preferencia">Preferência de produtos</label>
      <select id="preferencia" name="preferencia" required>
        <option value="">Selecione uma preferência</option>
        <option value="romance">Romance</option>
        <option value="ficcao">Ficção</option>
        <option value="fantasia">Fantasia</option>
        <option value="aventura">Aventura</option>
        <option value="nao-sei">Ainda não tenho preferência</option>
      </select>

      <button type="submit">Enviar cadastro</button>
    </form>

    <a class="voltar" href="index.html">Voltar para a página principal</a>
  </main>
  <footer id="contato">
    <p>Contato: entre em contato com a equipe da Vira Página.</p>
    <p>&copy; 2026 Vira Página. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
